name: PR Test

# Ported from radixark/miles (.github/workflows/pr-test.yml).
#
# Differences vs miles main:
#   * GPU suites are NOT static jobs: `enumerate-gpu-suites` derives them
#     from `register_cuda_ci` registrations and the `gpu` job fans out via
#     a dynamic matrix. Registering a test is the only step needed — no
#     workflow edits. Suite names encode the runner shape
#     (…-<N>-gpu-<family> → labels [<family>, "<N>gpu"]).
#   * `resolve-ci-image` job removed — the image is fixed in _run-ci.yml.
#   * `ci_megatron_pr` workflow_dispatch input removed — miles-D source has
#     zero `from megatron` imports.

on:
  pull_request:
    types: [synchronize, labeled, opened, reopened]
  workflow_dispatch:
    inputs:
      ci_sglang_pr:
        description: 'SGLang branch/commit (default: sglang-miles)'
        required: false
        type: string
        default: 'sglang-miles-diffusion'
      ci_sglang_repo:
        description: 'SGLang repository owner/name (default: Rockdu/sglang)'
        required: false
        type: string
        default: 'Rockdu/sglang'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PR labels are passed through to run_suite.py as raw `run-ci-<X>` strings via
# `--labels`. run_suite.py strips the `run-ci-` prefix internally and ignores
# any label that does not start with `run-ci-` (see tests/ci/run_suite.py
# `strip_run_ci_prefix`). For `workflow_dispatch`, no PR labels exist, so the
# `--labels` list collapses to empty; `--match-all-labels` is then added
# unconditionally to bypass the labels predicate inside run_suite.py and run
# every enabled test in the suite.

jobs:
  # Stage A: CPU-only fast tests (always runs on PR)
  stage-a-cpu:
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request)
    uses: ./.github/workflows/_run-ci.yml
    with:
      cpu_runner: true
      execute_command: >-
        python tests/ci/run_suite.py --hw cpu --suite stage-a-cpu
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
    secrets: inherit

  # Stage B: CPU-only slower bucket (currently empty; reserved for future
  # CPU tests that don't fit stage-a-cpu's fast budget). Always runs on PR.
  # Empty result exits 0 in run_suite.py.
  stage-b-cpu:
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request)
    uses: ./.github/workflows/_run-ci.yml
    with:
      cpu_runner: true
      execute_command: >-
        python tests/ci/run_suite.py --hw cpu --suite stage-b-cpu
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
    secrets: inherit

  # Derive the GPU suite list from register_cuda_ci registrations, so a new
  # suite/test never needs a workflow edit.
  enumerate-gpu-suites:
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.enum.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: enum
        shell: bash
        run: |
          MATRIX=$(PYTHONPATH=. python3 tests/ci/run_suite.py --enumerate-cuda-suites)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Enumerated GPU suites: $MATRIX"

  # One matrix job per enumerated suite, gated on stage-a-cpu so broken
  # imports don't burn GPU runner slots.
  gpu:
    needs: [enumerate-gpu-suites, stage-a-cpu]
    if: |
      always() && !cancelled() && needs.stage-a-cpu.result == 'success' &&
      needs.enumerate-gpu-suites.outputs.matrix != '[]' &&
      ((github.event_name == 'workflow_dispatch') || (github.event.pull_request))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.enumerate-gpu-suites.outputs.matrix) }}
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: ${{ toJSON(matrix.runs_on) }}
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda --suite ${{ matrix.suite }}
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
    secrets: inherit
