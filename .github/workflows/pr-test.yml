name: PR Test

# Ported from radixark/miles (.github/workflows/pr-test.yml).
#
# Differences vs miles main:
#   * GPU stages run on the dedicated miles-D CI node (8×H200,
#     node-radixark-32-0000) split into (h200,3gpu) + (h200,5gpu) runners —
#     stage-b (fast-gpu) and stage-c (e2e) only, no stage-c-8-gpu-h100.
#   * `resolve-ci-image` resolves a `radixark/miles_diffusion:<tag>`
#     container (default `latest`), overridable via the `ci-image-tag:`
#     PR-body line or the `ci_image_tag` dispatch input.
#   * `docker-paths` + `docker-build` build a `pr-<num>` image on docker PRs.
#   * `ci_megatron_pr` workflow_dispatch input removed — miles-D source has
#     zero `from megatron` imports.
#   * Nightly full CI on main: every suite with `--match-all-labels`, like
#     miles main's cron (catches drift in floating deps: sglang main tip,
#     image `latest`, HF snapshots).

on:
  pull_request:
    types: [synchronize, labeled, opened, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    # 16:30 UTC = 09:30 PDT / 08:30 PST (cron is UTC, no DST).
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      ci_sglang_pr:
        description: 'SGLang branch/commit (default: sglang-miles)'
        required: false
        type: string
        default: 'sglang-miles-diffusion'
      ci_sglang_repo:
        description: 'SGLang repository owner/name (default: Rockdu/sglang)'
        required: false
        type: string
        default: 'Rockdu/sglang'
      ci_image_tag:
        description: 'miles-diffusion Docker image tag (default: latest)'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR updates supersede their previous run; cron and manual runs on main
  # must not cancel one another.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.schedule || github.run_id }}
  cancel-in-progress: true

# PR labels are passed through to run_suite.py as raw `run-ci-<X>` strings via
# `--labels`. run_suite.py strips the `run-ci-` prefix internally and ignores
# any label that does not start with `run-ci-` (see tests/ci/run_suite.py
# `strip_run_ci_prefix`). For `workflow_dispatch`, no PR labels exist, so the
# `--labels` list collapses to empty; `--match-all-labels` is then added
# unconditionally to bypass the labels predicate inside run_suite.py and run
# every enabled test in the suite.

jobs:
  # Keep unreviewed code off the expensive self-hosted runners. Review events
  # retrigger this workflow, while schedule and manual runs remain trusted.
  # The same gate also identifies documentation-only PRs.
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.trusted.outputs.authorized || steps.pr.outputs.authorized }}
      docs_only: ${{ steps.trusted.outputs.docs_only || steps.pr.outputs.docs_only }}
    steps:
      - name: Allow trusted non-PR runs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        id: trusted
        shell: bash
        run: |
          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "docs_only=false" >> "$GITHUB_OUTPUT"

      - name: Check authorization and changed files
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number, per_page: 100 },
            );
            const trustedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const decisiveReviews = new Map();
            for (const review of reviews) {
              if (!review.user || !trustedAssociations.has(review.author_association)) {
                continue;
              }
              if (!["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(review.state)) {
                continue;
              }
              const previous = decisiveReviews.get(review.user.id);
              if (!previous || review.id > previous.id) {
                decisiveReviews.set(review.user.id, review);
              }
            }
            const reviewApproved = [...decisiveReviews.values()].some(
              (review) => review.state === "APPROVED",
            );
            // Applying labels requires triage (or stronger) repository
            // permission, so run-ci-* also acts as a maintainer authorization.
            const labelAuthorized = context.payload.pull_request.labels.some(
              (label) => label.name.startsWith("run-ci-"),
            );
            const authorized = reviewApproved || labelAuthorized;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 },
            );
            const isDocumentation = (filename) => {
              if (filename.startsWith("docs/")) {
                return true;
              }
              if (
                filename.startsWith(".github/ISSUE_TEMPLATE/") ||
                filename.startsWith(".github/PULL_REQUEST_TEMPLATE/")
              ) {
                return true;
              }
              if (/\.(md|mdx|rst)$/i.test(filename)) {
                return true;
              }
              return /^(LICENSE|NOTICE|CITATION\.cff)$/i.test(filename);
            };
            const docsOnly = files.length > 0 && files.every(
              (file) =>
                isDocumentation(file.filename) &&
                (!file.previous_filename || isDocumentation(file.previous_filename)),
            );

            core.setOutput("authorized", String(authorized));
            core.setOutput("docs_only", String(docsOnly));
            core.info(
              `CI gate: review_approved=${reviewApproved}, ` +
                `label_authorized=${labelAuthorized}, docs_only=${docsOnly}, ` +
                `changed_files=${files.length}`,
            );
            if (!authorized) {
              core.setFailed(
                "PR CI requires a trusted approval or a maintainer-applied run-ci-* label.",
              );
            }

  # Nothing rebuilds the CI image for a PR, so a docker PR would otherwise be tested inside the old `latest`.
  docker-paths:
    needs: [ci-gate]
    if: |
      needs.ci-gate.outputs.authorized == 'true' &&
      needs.ci-gate.outputs.docs_only != 'true' &&
      github.event_name != 'workflow_dispatch' &&
      github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_review otherwise checks out the default branch.
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        shell: bash
        run: |
          # Compare the PR merge commit with its current base.
          CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD)
          # Same paths as docker-build.yml's post-merge filter.
          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(docker/Dockerfile|requirements\.txt)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Docker PRs: build the image first, then run every GPU suite inside it.
  docker-build:
    needs: [docker-paths]
    if: needs.docker-paths.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      # Container CI jobs leave root-owned files in the shared workspace; reclaim it before checkout cleans.
      - name: Fix workspace ownership
        run: docker run --rm -v "${{ github.workspace }}:/ws" alpine:3 chown -R "$(id -u):$(id -g)" /ws

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="radixark/miles_diffusion:pr-${{ github.event.pull_request.number }}"
          # --no-cache --pull: the Dockerfile fetches branch tips, so cached layers would pin stale sources.
          docker build --no-cache --pull -f docker/Dockerfile . -t "${IMAGE}"
          docker push "${IMAGE}"

      # Each no-cache build leaves a full new layer set locally; keep the runner disk from filling up.
      - name: Prune local build leftovers
        if: always()
        run: docker image prune -f

  resolve-ci-image:
    needs: [ci-gate, docker-build]
    # A failed build must skip this job so the GPU stages' `success` guard stops the matrix.
    if: |
      always() && !cancelled() &&
      needs.ci-gate.outputs.authorized == 'true' &&
      needs.ci-gate.outputs.docs_only != 'true' &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule') || (github.event.pull_request))
    runs-on: ubuntu-latest
    outputs:
      container_image: ${{ steps.resolve.outputs.container_image }}
    steps:
      - name: Resolve CI image
        id: resolve
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          INPUT_CI_IMAGE_TAG: ${{ github.event.inputs.ci_image_tag || '' }}
          DOCKER_BUILT: ${{ needs.docker-build.result == 'success' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          CI_IMAGE_TAG="${INPUT_CI_IMAGE_TAG}"
          # A freshly built PR image outranks the `ci-image-tag:` directive.
          [ -z "$CI_IMAGE_TAG" ] && [ "$DOCKER_BUILT" = "true" ] && CI_IMAGE_TAG="pr-${PR_NUMBER}"
          if [ -n "$PR_BODY" ]; then
            PR_CI_IMAGE_TAG=$(echo "$PR_BODY" | grep -m1 -oP '^ci-image-tag:\s+\K\S+' || true)
            [ -z "$CI_IMAGE_TAG" ] && [ -n "$PR_CI_IMAGE_TAG" ] && CI_IMAGE_TAG="$PR_CI_IMAGE_TAG"
          fi
          [ -z "$CI_IMAGE_TAG" ] && CI_IMAGE_TAG="latest"
          if [[ ! "$CI_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::ci-image-tag must be a Docker tag, not a full image name: $CI_IMAGE_TAG"
            exit 1
          fi
          echo "container_image=radixark/miles_diffusion:${CI_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved CI image: radixark/miles_diffusion:${CI_IMAGE_TAG}"

  # Stage A: CPU-only fast tests. PRs require authorization; docs-only PRs run
  # the full CPU suite and stop before the GPU stages.
  stage-a-cpu:
    needs: [ci-gate]
    if: needs.ci-gate.outputs.authorized == 'true'
    uses: ./.github/workflows/_run-ci.yml
    with:
      cpu_runner: true
      execute_command: >-
        python tests/ci/run_suite.py --hw cpu --suite stage-a-cpu
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.ci-gate.outputs.docs_only == 'true' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
        ${{ github.event_name == 'schedule' && '--nightly' || '' }}
    secrets: inherit

  # Stage B: CPU-only slower bucket (currently empty; reserved for future
  # CPU tests that don't fit stage-a-cpu's fast budget). Runs after stage A.
  # Empty result exits 0 in run_suite.py.
  stage-b-cpu:
    needs: [ci-gate, stage-a-cpu]
    if: needs.ci-gate.outputs.authorized == 'true' && needs.stage-a-cpu.result == 'success'
    uses: ./.github/workflows/_run-ci.yml
    with:
      cpu_runner: true
      execute_command: >-
        python tests/ci/run_suite.py --hw cpu --suite stage-b-cpu
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.ci-gate.outputs.docs_only == 'true' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
        ${{ github.event_name == 'schedule' && '--nightly' || '' }}
    secrets: inherit

  # Stage B GPU: fast-gpu bucket, runs once stage-a-cpu is green (fast-fail:
  # broken imports shouldn't burn GPU runner slots). The always()/result
  # guards are load-bearing: docker-build skips on non-docker PRs, and a bare
  # `if` would inherit that skip and cascade it downstream (#67 regression).
  stage-b-3-gpu-h200:
    needs: [ci-gate, resolve-ci-image, stage-a-cpu]
    if: |
      always() && !cancelled() &&
      needs.ci-gate.outputs.authorized == 'true' &&
      needs.ci-gate.outputs.docs_only != 'true' &&
      needs.resolve-ci-image.result == 'success' &&
      needs.stage-a-cpu.result == 'success' &&
      ((github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule') || (github.event.pull_request))
    uses: ./.github/workflows/_run-ci.yml
    with:
      # Suite names match the runner split: 3gpu (GPUs 0-2) + 5gpu (GPUs 3-7).
      runs_on: '["h200", "3gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda --suite stage-b-3-gpu-h200
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
        ${{ github.event_name == 'schedule' && '--nightly' || '' }}
    secrets: inherit

  # Stage B GPU: 4-GPU distributed tests on the 5gpu runner.
  stage-b-5-gpu-h200:
    needs: [ci-gate, resolve-ci-image, stage-a-cpu]
    if: |
      always() && !cancelled() &&
      needs.ci-gate.outputs.authorized == 'true' &&
      needs.ci-gate.outputs.docs_only != 'true' &&
      needs.resolve-ci-image.result == 'success' &&
      needs.stage-a-cpu.result == 'success' &&
      ((github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule') || (github.event.pull_request))
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: '["h200", "5gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda --suite stage-b-5-gpu-h200
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
        ${{ github.event_name == 'schedule' && '--nightly' || '' }}
    secrets: inherit

  # Fan-in so each stage-c needs one job instead of every stage-b.
  stage-b:
    needs: [stage-b-cpu, stage-b-3-gpu-h200, stage-b-5-gpu-h200]
    if: |
      always() && !cancelled() &&
      needs.stage-b-cpu.result == 'success' &&
      needs.stage-b-3-gpu-h200.result == 'success' &&
      needs.stage-b-5-gpu-h200.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  # Stage C GPU (3gpu runner): e2e suite for the 2-GPU SD3.5 OCR recipe.
  stage-c-3-gpu-h200:
    needs: [resolve-ci-image, stage-b]
    if: |
      always() && !cancelled() &&
      needs.resolve-ci-image.result == 'success' &&
      needs.stage-b.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
        (github.event.pull_request &&
          !contains(github.event.pull_request.labels.*.name, 'skip-ci-stage-c')))
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: '["h200", "3gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda --suite stage-c-3-gpu-h200
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
        ${{ github.event_name == 'schedule' && '--nightly' || '' }}
    secrets: inherit

  # Stage C GPU: e2e suite on the 5gpu runner.
  stage-c-5-gpu-h200:
    needs: [resolve-ci-image, stage-b]
    if: |
      always() && !cancelled() &&
      needs.resolve-ci-image.result == 'success' &&
      needs.stage-b.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
        (github.event.pull_request &&
          !contains(github.event.pull_request.labels.*.name, 'skip-ci-stage-c')))
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: '["h200", "5gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda --suite stage-c-5-gpu-h200
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
        ${{ github.event_name == 'schedule' && '--nightly' || '' }}
    secrets: inherit
