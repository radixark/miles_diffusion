name: async-overlap dep bisect

on:
  push:
    branches: [debug/async-overlap-dep-bisect]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: tvm-post2
            pins: "apache-tvm-ffi==0.1.15.post2"
          - variant: tvm-post1
            pins: "apache-tvm-ffi==0.1.15.post1"
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: a5701d958b078fae92f83db8fc94530a18650d04
          path: sglang
      - name: Install dependencies (same as _run-ci.yml run-cpu)
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          sudo apt-get update -q -o Acquire::Retries=3 || true
          sudo apt-get install -y -q protobuf-compiler ffmpeg
          SGLANG_BUILD_RUST_EXTS=none uv pip install -e sglang/python --no-deps
          uv pip install -r requirements.txt -r tests/ci/requirements-ci-cpu.txt
          uv pip install -e . --no-deps
          uv pip install tests/ci/cpu_stubs
          if [ -n "${{ matrix.pins }}" ]; then uv pip install ${{ matrix.pins }}; fi
          uv pip freeze | grep -iE "^(grpcio|wrapt|apache-tvm-ffi|cuda-pathfinder|hf-xet|modelscope-hub|smart-open|ray)=="
          nproc; lscpu | grep -E "Model name|^CPU\(s\)"
      - name: Probe mechanism
        run: |
          sed -i "s/^    for i in range(2):$/    for i in range(2):\n        print('GAPPROBE', i, round(records[i][1] - events[i + 1][1], 4))/" tests/fast/rollout/test_async_training.py
          T="tests/fast/rollout/test_async_training.py::test_overlap_reference_cursor_and_update_barrier[0.25-0.05]"
          snap() { echo "== cache after $1"; find ~/.cache -maxdepth 3 -newer pyproject.toml 2>/dev/null | grep -vE "uv/|pip/" | head -30; }
          echo "### A: default, 3 runs"
          for k in 1 2 3; do python -m pytest -q -s -p no:cacheprovider "$T" 2>&1 | grep -E "GAPPROBE 0|passed|failed"; snap "A$k"; done
          echo "### B: TVM_FFI_DISABLE_TORCH_C_DLPACK=1, 3 runs"
          for k in 1 2 3; do TVM_FFI_DISABLE_TORCH_C_DLPACK=1 python -m pytest -q -s -p no:cacheprovider "$T" 2>&1 | grep -E "GAPPROBE 0|passed|failed"; done
          echo "### C: rm ~/.cache/tvm-ffi before each run, 3 runs"
          for k in 1 2 3; do rm -rf ~/.cache/tvm-ffi; python -m pytest -q -s -p no:cacheprovider "$T" 2>&1 | grep -E "GAPPROBE 0|passed|failed"; done
          echo "### D: torch dlpack exchange api after import"
          python -c "import time,torch;t=time.time();import tvm_ffi;print('import tvm_ffi', round(time.time()-t,3), 'exchange_api', hasattr(torch.Tensor,'__dlpack_c_exchange_api__'))"
          python -c "import sys,miles.backends.fsdp_utils.actor; print('tvm_ffi loaded by actor import:', 'tvm_ffi' in sys.modules)"
          ls -la ~/.cache/tvm-ffi 2>/dev/null || true
