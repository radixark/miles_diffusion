name: async-overlap dep bisect

on:
  push:
    branches: [debug/async-overlap-dep-bisect]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: tvm-post2
            pins: "apache-tvm-ffi==0.1.15.post2"
          - variant: tvm-post1
            pins: "apache-tvm-ffi==0.1.15.post1"
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: a5701d958b078fae92f83db8fc94530a18650d04
          path: sglang
      - name: Install dependencies (same as _run-ci.yml run-cpu)
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          sudo apt-get update -q -o Acquire::Retries=3 || true
          sudo apt-get install -y -q protobuf-compiler ffmpeg
          SGLANG_BUILD_RUST_EXTS=none uv pip install -e sglang/python --no-deps
          uv pip install -r requirements.txt -r tests/ci/requirements-ci-cpu.txt
          uv pip install -e . --no-deps
          uv pip install tests/ci/cpu_stubs
          if [ -n "${{ matrix.pins }}" ]; then uv pip install ${{ matrix.pins }}; fi
          uv pip freeze | grep -iE "^(grpcio|wrapt|apache-tvm-ffi|cuda-pathfinder|hf-xet|modelscope-hub|smart-open|ray)=="
          nproc; lscpu | grep -E "Model name|^CPU\(s\)"
      - name: Probe where the lag goes
        run: |
          F=tests/fast/rollout/test_async_training.py
          python - "$F" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          s = s.replace("    for i in range(2):\n", "    for i in range(2):\n        print('GAPPROBE', i, round(records[i][1] - events[i + 1][1], 4))\n", 1)
          s = s.replace("    def train(self, rollout_id, batch):\n", "    def train(self, rollout_id, batch):\n        import time as _t; print('TSTAMP trainer_entry', rollout_id, _t.monotonic(), flush=True)\n", 1)
          s = s.replace("        start = time.monotonic()\n        with self.ema_optimizer", "        start = time.monotonic()\n        print('TSTAMP train_core', rollout_id, start, flush=True)\n        with self.ema_optimizer", 1)
          s = s.replace("    def async_train(self, rollout_id, batch):\n", "    def async_train(self, rollout_id, batch):\n        print('TSTAMP driver_submit', rollout_id, time.monotonic(), flush=True)\n", 1)
          s = s.replace("        start = time.monotonic()\n        sample = self.source", "        start = time.monotonic()\n        print('TSTAMP rollout_start', rollout_id, start, flush=True)\n        sample = self.source", 1)
          p.write_text(s)
          PY
          grep -c TSTAMP $F
          python - <<'PY'
          import pathlib
          p = pathlib.Path("miles/backends/fsdp_utils/actor.py"); s = p.read_text()
          a = '        with inverse_timer("train_wait"), timer("train"):\n            rollout_data = ray.get('
          assert a in s
          s = s.replace(a, "        import time as _t; print('TSTAMP actor_before_timer', rollout_id, _t.monotonic(), flush=True)\n" + '        with inverse_timer("train_wait"), timer("train"):\n' + "            print('TSTAMP actor_in_timer', rollout_id, _t.monotonic(), flush=True)\n            rollout_data = ray.get(", 1)
          b = "            if self.args.debug_rollout_only:\n                return\n            self._train_core("
          assert b in s
          s = s.replace(b, "            print('TSTAMP actor_after_get', rollout_id, _t.monotonic(), flush=True)\n" + b, 1)
          p.write_text(s)
          PY
          grep -c "TSTAMP actor" miles/backends/fsdp_utils/actor.py
          T="$F::test_overlap_reference_cursor_and_update_barrier[0.25-0.05]"
          printf 'import gc, os\nif os.environ.get("GC_STATS") == "1":\n    gc.set_debug(gc.DEBUG_STATS)\nif os.environ.get("GC_OFF") == "1":\n    gc.disable()\n' > sitecustomize.py
          for k in 1 2 3; do echo "### stats run $k"; GC_STATS=1 python -m pytest -q -s -p no:cacheprovider "$T" > run.log 2>&1; grep -E "TSTAMP (trainer_entry|actor_before_timer) 0 |GAPPROBE 0|passed|failed" run.log; grep -B1 -E "done, .*[0-9]\.[0-9]+s elapsed" run.log | grep -E "TrainerProbe" | grep -E "elapsed" | awk '{for(i=1;i<=NF;i++) if($i ~ /s$/ && $(i+1)=="elapsed") {v=substr($i,1,length($i)-1); if (v+0 > 0.05) print}}' | head; grep -E "TrainerProbe.*gc: collecting generation 2" run.log | wc -l; done
          for k in 1 2 3; do echo "### gc off run $k"; GC_OFF=1 python -m pytest -q -s -p no:cacheprovider "$T" 2>&1 | grep -E "GAPPROBE 0|passed|failed"; done
          echo "### importtime of the trainer import chain"
          python -X importtime -c "import miles.backends.fsdp_utils.actor" 2>&1 | sort -t'|' -k2 -n | tail -15
