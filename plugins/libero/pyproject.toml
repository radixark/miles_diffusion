[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miles-libero"
version = "0.1.0"
description = "LIBERO data preparation, supervised training and SGLang evaluation for Miles pi05"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["pi05_tools*"]
